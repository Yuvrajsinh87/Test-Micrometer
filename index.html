<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>માઈક્રોમીટર રીડિંગ ઓનલાઈન ટેસ્ટ</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 15px; }
        .container { max-width: 700px; background: white; margin: 0 auto; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 5px; }
        .author-tag { text-align: center; font-size: 14px; font-weight: bold; color: #16a085; background: #e8f8f5; padding: 8px; border-radius: 5px; margin-bottom: 20px; border: 1px solid #a3e4d7; }
        .form-group { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; color: #333; }
        input[type="text"], input[type="tel"], input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        .question-card { background: #f8f9fa; padding: 15px; margin-bottom: 20px; border-left: 5px solid #3498db; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .question-title { font-weight: bold; font-size: 1.05em; color: #2c3e50; margin-bottom: 10px; }
        .micrometer-svg { width: 100%; max-width: 500px; height: auto; display: block; margin: 10px auto; background: #ffffff; border: 1px solid #e0e0e0; border-radius: 5px; }
        button { background: #27ae60; color: white; border: none; padding: 12px 20px; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; width: 100%; transition: 0.3s; }
        button:hover { background: #219150; }
        #quiz-area, #result-area { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>માઈક્રોમીટર રીડિંગ ઓનલાઈન ટેસ્ટ</h2>
    <div class="author-tag">Test Created by Yuvrajsinh Kosamia - ITI Ankleshwar (Mechanic Diesel)</div>

    <!-- ૧. રજીસ્ટ્રેશન ફોર્મ -->
    <div id="registration">
        <div class="form-group">
            <label>તાલીમાર્થીનું નામ:</label>
            <input type="text" id="traineeName" placeholder="તમારું પૂરૂં નામ લખો" required>
        </div>
        <div class="form-group">
            <label>મોબાઈલ નંબર:</label>
            <input type="tel" id="traineeMobile" placeholder="10 અંકનો મોબાઈલ નંબર" required>
        </div>
        <button onclick="startQuiz()">ટેસ્ટ શરૂ કરો</button>
    </div>

    <!-- ૨. ક્વિઝ એરિયા (૨૦ પ્રશ્નો) -->
    <div id="quiz-area">
        <form id="quizForm">
            <div id="questionsContainer"></div>
            <button type="button" onclick="submitQuiz()">ટેસ્ટ સબમિટ કરો</button>
        </form>
    </div>

    <!-- ૩. રિઝલ્ટ એરિયા -->
    <div id="result-area" style="text-align: center;">
        <h3 style="color: #27ae60;">તમારી ટેસ્ટ સફળતાપૂર્વક સબમિટ થઈ ગઈ છે!</h3>
        <p id="scoreText" style="font-size: 20px; font-weight: bold; color: #2c3e50;"></p>
        <p style="color: #7f8c8d;">તમારું પરિણામ ઓટોમેટિક રેકોર્ડ થઈ ગયું છે.</p>
    </div>
</div>

<script>
    // તમારી Google Apps Script ની ઓરિજિનલ Web App URL
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzdAg0vv-sWwcEfSQytap-L5L0sioEHND-EdH3ssdtHhN5IDaghifwcqJMkY51F92bTrw/exec';
    
    let traineeData = {};
    let selectedQuestions = [];

    // SVG માઈક્રોમીટર ડ્રોઈંગ જનરેટર
    function generateMicrometerSVG(mainScale, subScale, thimbleScale) {
        let thimbleOffset = (mainScale + subScale) * 12;
        let thimbleRotation = (thimbleScale / 50) * 100;

        let mainScaleLines = '';
        for (let i = 0; i <= 25; i++) {
            let x = 120 + (i * 12);
            let isFive = (i % 5 === 0);
            let h = isFive ? 25 : 15;
            mainScaleLines += `<line x1="${x}" y1="80" x2="${x}" y2="${80 - h}" stroke="#333" stroke-width="${isFive ? 2 : 1}"/>`;
            if (isFive) {
                mainScaleLines += `<text x="${x}" y="${80 - 28}" font-size="11" text-anchor="middle" fill="#333">${i}</text>`;
            }
        }

        let subScaleLines = '';
        for (let i = 0; i < 25; i++) {
            let x = 126 + (i * 12);
            subScaleLines += `<line x1="${x}" y1="80" x2="${x}" y2="95" stroke="#333" stroke-width="1"/>`;
        }

        let thimbleLines = '';
        for (let i = -5; i <= 55; i++) {
            let y = 80 - ((i - thimbleScale) * 3);
            if (y >= 20 && y <= 140) {
                let isFive = (i % 5 === 0);
                thimbleLines += `<line x1="${240 + thimbleOffset}" y1="${y}" x2="${255 + thimbleOffset}" y2="${y}" stroke="#fff" stroke-width="${isFive ? 2 : 1}"/>`;
                if (isFive && i >= 0 && i < 50) {
                    thimbleLines += `<text x="${260 + thimbleOffset}" y="${y + 4}" font-size="10" fill="#fff" font-weight="bold">${i}</text>`;
                }
            }
        }

        return `
        <svg class="micrometer-svg" viewBox="0 0 500 160" xmlns="http://www.w3.org/2000/svg">
            <rect width="100%" height="100%" fill="#ffffff"/>
            <!-- Frame and Sleeve -->
            <rect x="20" y="65" width="90" height="30" fill="#7f8c8d" rx="3"/>
            <rect x="110" y="50" width="320" height="60" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="2"/>
            
            <!-- Datum Line -->
            <line x1="110" y1="80" x2="${240 + thimbleOffset}" y2="80" stroke="#c0392b" stroke-width="2"/>
            
            <!-- Main Scale & Sub Scale -->
            ${mainScaleLines}
            ${subScaleLines}
            
            <!-- Thimble -->
            <path d="M ${240 + thimbleOffset} 30 L ${270 + thimbleOffset} 30 L ${290 + thimbleOffset} 45 L ${290 + thimbleOffset} 115 L ${270 + thimbleOffset} 130 L ${240 + thimbleOffset} 130 Z" fill="#2c3e50" stroke="#1a252f" stroke-width="2"/>
            <line x1="${240 + thimbleOffset}" y1="30" x2="${240 + thimbleOffset}" y2="130" stroke="#e74c3c" stroke-width="3"/>
            
            <!-- Thimble Scale Lines -->
            ${thimbleLines}
            
            <!-- Ratchet Stop -->
            <rect x="${290 + thimbleOffset}" y="60" width="40" height="40" fill="#7f8c8d" rx="2"/>
        </svg>`;
    }

    // ૨૦ રેન્ડમ પ્રશ્નો જનરેટ કરવા માટે
    function generateQuestions() {
        let questions = [];
        for (let i = 0; i < 40; i++) {
            let mainScale = Math.floor(Math.random() * 18);
            let subScale = Math.random() < 0.5 ? 0.0 : 0.5;
            let thimbleScale = Math.floor(Math.random() * 50);
            
            let totalReading = (mainScale + subScale + (thimbleScale * 0.01)).toFixed(2);
            
            questions.push({
                mainScale: mainScale,
                subScale: subScale,
                thimbleScale: thimbleScale,
                correctAnswer: totalReading
            });
        }
        // શફલ કરીને ૨૦ પ્રશ્નો પસંદ કરવા
        return questions.sort(() => 0.5 - Math.random()).slice(0, 20);
    }

    function startQuiz() {
        const name = document.getElementById('traineeName').value.trim();
        const mobile = document.getElementById('traineeMobile').value.trim();

        if (name === "" || mobile.length !== 10) {
            alert("કૃપા કરીને તમારું પૂરું નામ અને ૧૦ અંકનો યોગ્ય મોબાઈલ નંબર દાખલ કરો.");
            return;
        }

        traineeData.name = name;
        traineeData.mobile = mobile;

        document.getElementById('registration').style.display = 'none';
        document.getElementById('quiz-area').style.display = 'block';

        selectedQuestions = generateQuestions();
        const container = document.getElementById('questionsContainer');
        container.innerHTML = '';

        selectedQuestions.forEach((q, index) => {
            const qDiv = document.createElement('div');
            qDiv.className = 'question-card';
            
            const svgCode = generateMicrometerSVG(q.mainScale, q.subScale, q.thimbleScale);
            
            qDiv.innerHTML = `
                <div class="question-title">પ્રશ્ન ${index + 1}: આપેલ ચિત્ર પરથી માઈક્રોમીટરનું રીડિંગ શોધીને લખો (mm માં)</div>
                ${svgCode}
                <div style="margin-top: 10px;">
                    <label>તમારો જવાબ (mm):</label>
                    <input type="number" step="0.01" id="ans_${index}" placeholder="દા.ત. 12.45" required>
                </div>
            `;
            container.appendChild(qDiv);
        });
        window.scrollTo(0, 0);
    }

    function submitQuiz() {
        let score = 0;
        let allAnswered = true;

        for (let i = 0; i < selectedQuestions.length; i++) {
            const inputVal = document.getElementById(`ans_${i}`).value;
            if (inputVal === "") {
                allAnswered = false;
                break;
            }
        }

        if (!allAnswered) {
            alert("કૃપા કરીને બધા પ્રશ્નોના જવાબ આપો.");
            return;
        }

        selectedQuestions.forEach((q, index) => {
            const userAns = parseFloat(document.getElementById(`ans_${index}`).value).toFixed(2);
            if (userAns === q.correctAnswer) {
                score++;
            }
        });

        traineeData.score = `${score} / 20`;

        document.getElementById('quiz-area').style.display = 'none';
        document.getElementById('result-area').style.display = 'block';
        document.getElementById('scoreText').innerText = `${traineeData.name}, તમારો સ્કોર: ${traineeData.score}`;
        window.scrollTo(0, 0);

        // Google Sheets માં ડેટા મોકલવો
        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(traineeData)
        }).catch(error => console.error('Error!', error.message));
    }
</script>

</body>
</html>
